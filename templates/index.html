<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Stock Charts</title>
    <!-- Include Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <!-- TradingView Lightweight Charts (same renderer used by stock_chart) -->
    <script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script>
    <!-- Include Socket.IO -->
    <!--<script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script> -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.0/socket.io.js"></script>
    <style>
      .ema-legend {
        display: flex;
        gap: 0.75rem;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .ema-6 { color: #ef4444; }
      .ema-12 { color: #f59e0b; }
      .ema-30 { color: #7c3aed; }
      .stocknear-link {
        font-size: 0.7rem;
        font-weight: 400;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <!-- Navigation bar-->
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
          <div class="container">
              <a class="navbar-brand" href="#">Sectors</a>
              <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                  <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarResponsive">
                  <ul class="navbar-nav ml-auto">
                      <li class="nav-item">
                          <a class="nav-link" href="{{ url_for('index') }}">Home
                          </a>
                      </li>
                      <li class="nav-item">
                          <a class="navbar-brand" id="sector-link" href="{{ url_for('sectors') }}">Sector</a>
                      </li>
                      <li class="nav-item active">
                          <a class="navbar-brand" id="sector2-link" href="{{ url_for('sectors2') }}">Sector2</a>
                      </li>
                      <li class="nav-item">
                          <a class="navbar-brand" id="sector3-link" href="{{ url_for('sectors3') }}">Sector3</a>
                      </li>
                      <li class="nav-item">
                          <a class="nav-link" href="#">关于</a>
                      </li>
                      <li class="nav-item">
                          <a class="nav-link" href="#">数据服务</a>
                      </li>
                      <li class="nav-item">
                          <a class="nav-link" href="#">联络我们</a>
                      </li>
                  </ul>
              </div>
          </div>
      </nav>
      <!-- Page Content -->
      <div class="row">  
        <div class="my-5"></div>
      </div>
      <h1 class="my-4">{{etf}} Stock Charts</h1>
      <div class="progress mb-4">
        <div id="progress-bar" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
          </div>
      <div id="charts-container" class="row">
        <!-- Charts will be dynamically inserted here -->
      </div>
      <div class="row">
        <div class="col-12">
          {{ pagination.links }}
        </div>
      </div>
      <button id="download-button" class="btn btn-primary mt-4">Download Selected</button>
    </div>
    <!-- Navigation -->
    <!-- Modals -->
    <div id="modals-container">
      <!-- Modals will be dynamically inserted here -->
      </div>

    <!-- Include Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
    <script type="text/javascript">
      const chartInstances = new Map();

      function normalizeChartTime(value) {
        return String(value).split('T')[0].split(' ')[0];
      }

      function getStocknearUrl(symbol) {
        return `https://stocknear.com/stocks/${encodeURIComponent(symbol)}`;
      }

      function renderStockChart(container, plotData, options = {}) {
        const { showTimeScale = false, height = 260 } = options;
        const candlesticks = plotData.data.find((trace) => trace.type === 'candlestick');
        if (!candlesticks || !candlesticks.x || candlesticks.x.length === 0) {
          container.textContent = 'No data';
          return null;
        }

        const existingChart = chartInstances.get(container.id);
        if (existingChart) {
          existingChart.remove();
        }

        const chart = LightweightCharts.createChart(container, {
          width: container.clientWidth,
          height: height,
          layout: {
            attributionLogo: false,
            background: { type: LightweightCharts.ColorType.Solid, color: 'transparent' },
            textColor: '#334155'
          },
          grid: {
            vertLines: { color: '#f1f5f9' },
            horzLines: { color: '#f1f5f9' }
          },
          crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
          handleScale: { mouseWheel: false, pinch: false },
          rightPriceScale: { borderVisible: false },
          timeScale: {
            borderVisible: showTimeScale,
            timeVisible: true,
            visible: showTimeScale
          }
        });

        const candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
          upColor: '#16a34a',
          downColor: '#dc2626',
          borderVisible: false,
          wickUpColor: '#16a34a',
          wickDownColor: '#dc2626'
        });
        candleSeries.setData(candlesticks.x.map((time, index) => ({
          time: normalizeChartTime(time),
          open: Number(candlesticks.open[index]),
          high: Number(candlesticks.high[index]),
          low: Number(candlesticks.low[index]),
          close: Number(candlesticks.close[index])
        })));

        const emaColors = ['#ef4444', '#f59e0b', '#7c3aed'];
        plotData.data
          .filter((trace) => trace.type === 'scatter' && trace.name.startsWith('EMA_'))
          .forEach((trace, traceIndex) => {
            const lineSeries = chart.addSeries(LightweightCharts.LineSeries, {
              color: emaColors[traceIndex % emaColors.length],
              lineWidth: 1,
              priceLineVisible: false,
              lastValueVisible: false
            });
            lineSeries.setData(trace.x.map((time, index) => ({
              time: normalizeChartTime(time),
              value: Number(trace.y[index])
            })).filter((point) => Number.isFinite(point.value)));
          });

        chart.timeScale().fitContent();

        const resizeObserver = new ResizeObserver((entries) => {
          const entry = entries[0];
          if (entry && entry.contentRect.width) {
            chart.applyOptions({ width: entry.contentRect.width });
          }
        });
        resizeObserver.observe(container);

        const originalRemove = chart.remove.bind(chart);
        chart.remove = function() {
          resizeObserver.disconnect();
          originalRemove();
        };
        chartInstances.set(container.id, chart);
        return chart;
      }

      const socket = io();

      // Listen for progress updates
      socket.on('progress_update', function(data) {
        const progressBar = document.getElementById('progress-bar');
        progressBar.style.width = data.progress + '%';
        progressBar.setAttribute('aria-valuenow', data.progress);
        progressBar.textContent = data.progress + '%';
      });

      // Listen for data ready event
      socket.on('data_ready', function(data) {
        const chartsContainer = document.getElementById('charts-container');
        const modalsContainer = document.getElementById('modals-container');

        for (const [stock, plot] of Object.entries(data.plots)) {
          // Create chart card
          const cardDiv = document.createElement('div');
          cardDiv.className = 'col-md-3 mb-4';
          cardDiv.innerHTML = `
            <div class="card">
              <div class="card-body">
                <h5 class="card-title">
                  <a href="#" data-toggle="modal" data-target="#modal-${stock}">${stock}</a>
                  <a class="stocknear-link ml-2" href="${getStocknearUrl(stock)}"
                     target="_blank" rel="noopener noreferrer"
                     title="View ${stock} on Stocknear">stocknear ↗</a>
                  <label class="float-right small font-weight-normal">
                    <input type="checkbox" class="stock-checkbox" data-stock="${stock}"> select
                  </label>
                </h5>
                <div class="ema-legend mb-2" aria-label="EMA indicators">
                  <span class="ema-6">EMA 6</span>
                  <span class="ema-12">EMA 12</span>
                  <span class="ema-30">EMA 30</span>
                </div>
                <div id="chart-${stock}" style="height: 260px;"></div>
              </div>
            </div>
          `;
          chartsContainer.appendChild(cardDiv);

          // Create modal
          const modalDiv = document.createElement('div');
          modalDiv.className = 'modal fade';
          modalDiv.id = `modal-${stock}`;
          modalDiv.tabIndex = -1;
          modalDiv.role = 'dialog';
          modalDiv.setAttribute('aria-labelledby', `modalLabel-${stock}`);
          modalDiv.setAttribute('aria-hidden', 'true');
          modalDiv.innerHTML = `
            <div class="modal-dialog modal-lg" role="document">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title" id="modalLabel-${stock}">${stock} Stock Chart</h5>
                  <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                  </button>
                </div>
                <div class="modal-body">
                  <div class="ema-legend mb-2" aria-label="EMA indicators">
                    <span class="ema-6">EMA 6</span>
                    <span class="ema-12">EMA 12</span>
                    <span class="ema-30">EMA 30</span>
                  </div>
                  <div id="modal-chart-${stock}" style="height: 560px;"></div>
                </div>
              </div>
            </div>
          `;
          modalsContainer.appendChild(modalDiv);

          // Render the card immediately. Render the modal only after it becomes
          // visible so Lightweight Charts can measure its actual width.
          const plotData = JSON.parse(plot);
          renderStockChart(document.getElementById(`chart-${stock}`), plotData);
          $(modalDiv).on('shown.bs.modal', function() {
            renderStockChart(
              document.getElementById(`modal-chart-${stock}`),
              plotData,
              { showTimeScale: true, height: 560 }
            );
          });
        }
      });

      // Fetch stock data
      const stocks = {{ stocks | tojson }};
      socket.emit('fetch_data', stocks);


      document.getElementById('download-button').addEventListener('click', function() {
        const selectedStocks = [];
        document.querySelectorAll('.stock-checkbox:checked').forEach(function(checkbox) {
            selectedStocks.push(checkbox.getAttribute('data-stock'));
        });
        //get the etf and page
        const etf = "{{etf}}";
        const page = "{{pagination.page}}";

        if (selectedStocks.length > 0) {
            const url = `/download_selected?stocks=${selectedStocks.join(',')}&etf=${etf}&page=${page}`;
            window.location.href = url;
        } else {
            alert('Please select at least one stock to download.');
        }
      });
    </script>
  </body>
</html>
