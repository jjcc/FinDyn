<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Stock Charts</title>
    <!-- Include Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <!-- Include Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  </head>
  <body>
    <div class="container-fluid">
      <h1 class="my-4">Stock Charts</h1>
      <div class="row">
        {% for stock, plot in plots.items() %}
          <div class="col-md-3 mb-3">
            <div class="card">
              <div class="card-body">
                <h5 class="card-title">
                  <a href="#" data-toggle="modal" data-target="#modal-{{ stock }}">{{ stock }}</a>
                </h5>
                <div id="plotly-div-{{ stock }}"></div>
              </div>
            </div>
          </div>
          {% if loop.index % 4 == 0 %}
            </div><div class="row">
          {% endif %}
        {% endfor %}
      </div>
      <div class="row">
        <div class="col-12">
          {{ pagination.links }}
        </div>
      </div>
    </div>

    <!-- Modals -->
    {% for stock, plot in plots.items() %}
      <div class="modal fade" id="modal-{{ stock }}" tabindex="-1" role="dialog" aria-labelledby="modalLabel-{{ stock }}" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="modalLabel-{{ stock }}">{{ stock }} Stock Chart</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <div id="plotly-modal-div-{{ stock }}"></div>
            </div>
          </div>
        </div>
      </div>
    {% endfor %}

    <!-- Include Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
    <script type="text/javascript">
      {% for stock, plot in plots.items() %}
        var plotData = {{ plot|safe }};
        Plotly.newPlot('plotly-div-{{ stock }}', plotData.data, plotData.layout);
        var plotModalData = JSON.parse(JSON.stringify(plotData)); // Deep copy the plot data
        plotModalData.layout.height = 600; // Increase the height for modal
        Plotly.newPlot('plotly-modal-div-{{ stock }}', plotModalData.data, plotModalData.layout);
      {% endfor %}
    </script>
  </body>
</html>
